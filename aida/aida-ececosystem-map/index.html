<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:transparent}
body{
  width:100%;margin:0 auto;
  background:transparent;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--c-body);
  overflow-x:hidden;
}

/* ── DARK THEME (default) ── */
:root{
  --c-body:#E8E6DF;
  --c-bg:#1A1A1A;
  --c-map-border:rgba(255,255,255,.06);
  --c-title:rgba(255,255,255,.85);
  --c-title-sub:rgba(255,255,255,.35);
  --c-btn-border:rgba(255,255,255,.12);
  --c-btn-text:rgba(255,255,255,.5);
  --c-btn-hover-border:rgba(59,108,211,.6);
  --c-btn-hover-text:rgba(255,255,255,.8);
  --c-btn-on-bg:#3B6CD3;
  --c-btn-on-border:#3B6CD3;
  --c-btn-on-text:#fff;
  --c-tt-bg:#2A2A28;
  --c-tt-border:rgba(255,255,255,.1);
  --c-tt-shadow:rgba(0,0,0,.4);
  --c-tt-name:#fff;
  --c-tt-sub:rgba(255,255,255,.4);
  --c-tt-desc:rgba(255,255,255,.6);
  --c-tt-flow:rgba(255,255,255,.45);
  --c-legend-text:rgba(255,255,255,.35);
  --c-legend-border:rgba(255,255,255,.05);
  --c-legend-dash-gov:rgba(255,255,255,.25);
  --c-legend-dash-tool:rgba(255,255,255,.15);
}

/* ── LIGHT THEME ── */
[data-theme="light"]{
  --c-body:#2C2C2A;
  --c-bg:#F8F7F4;
  --c-map-border:rgba(0,0,0,.07);
  --c-title:rgba(0,0,0,.8);
  --c-title-sub:rgba(0,0,0,.4);
  --c-btn-border:#E8E6DF;
  --c-btn-text:#5F5E5A;
  --c-btn-hover-border:#3B6CD3;
  --c-btn-hover-text:#3B6CD3;
  --c-btn-on-bg:#3B6CD3;
  --c-btn-on-border:#3B6CD3;
  --c-btn-on-text:#fff;
  --c-tt-bg:#fff;
  --c-tt-border:#E8E6DF;
  --c-tt-shadow:rgba(0,0,0,.1);
  --c-tt-name:#2C2C2A;
  --c-tt-sub:#888780;
  --c-tt-desc:#5F5E5A;
  --c-tt-flow:#5F5E5A;
  --c-legend-text:#888780;
  --c-legend-border:rgba(0,0,0,.07);
  --c-legend-dash-gov:#B4B2A9;
  --c-legend-dash-tool:#D3D1C7;
}

/* ── MAP CONTAINER ── */
.map-wrap{
  position:relative;width:100%;
  background:var(--c-bg);
  border-radius:12px;overflow:hidden;
  border:1px solid var(--c-map-border);
  transition:background .2s,border-color .2s;
}

/* ── HEADER ── */
.map-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.map-title{display:flex;align-items:center;gap:10px}
.logo{
  width:28px;height:28px;background:#3B6CD3;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Prompt',sans-serif;font-weight:700;font-size:12px;color:#fff;
  letter-spacing:-0.3px;
}
.title-text{font-family:'Prompt',sans-serif;font-weight:600;font-size:13px;color:var(--c-title);letter-spacing:.02em}
.title-sub{font-size:11px;color:var(--c-title-sub);margin-left:4px}

.controls{display:flex;gap:6px}
.ctrl-btn{
  font-family:'Inter',sans-serif;font-size:10px;font-weight:500;
  padding:5px 11px;border-radius:6px;
  border:1px solid var(--c-btn-border);background:transparent;
  color:var(--c-btn-text);cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.ctrl-btn:hover{border-color:var(--c-btn-hover-border);color:var(--c-btn-hover-text)}
.ctrl-btn.on{background:var(--c-btn-on-bg);border-color:var(--c-btn-on-border);color:var(--c-btn-on-text)}

/* ── SVG ── */
.map-body{position:relative;width:100%}
#svg{display:block;width:100%}

/* ── TOOLTIP ── */
.tt{
  position:absolute;pointer-events:none;
  background:var(--c-tt-bg);border:1px solid var(--c-tt-border);border-radius:6px;
  padding:8px 12px;max-width:260px;
  box-shadow:0 4px 16px var(--c-tt-shadow);
  opacity:0;transition:opacity .12s;z-index:30;
}
.tt.show{opacity:1}
.tt-name{font-family:'Prompt',sans-serif;font-weight:600;font-size:12px;color:var(--c-tt-name);margin-bottom:2px}
.tt-sub{font-size:10px;color:var(--c-tt-sub);margin-bottom:6px}
.tt-desc{font-size:10.5px;line-height:1.55;color:var(--c-tt-desc)}
.tt-flows{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.tt-flow{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--c-tt-flow)}
.tt-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ── LEGEND ── */
.legend-bar{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:16px;row-gap:6px;
  padding:14px 20px 16px;
  border-top:1px solid var(--c-legend-border);
}
.lg{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--c-legend-text);white-space:nowrap}
.lg-line{width:16px;height:2px;border-radius:1px}
.lg-line.dash{background:none!important;border-top:1.5px dashed}

/* ── SVG flow animations ── */
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes flowaida{to{stroke-dashoffset:-18}}
@keyframes flowslow{to{stroke-dashoffset:-28}}
.fa{animation:flow 1.8s linear infinite}
.fa2{animation:flowaida 1.2s linear infinite}
.fa3{animation:flowslow 2.4s linear infinite}
</style>
</head>

/* ═══════════════════════════════════════════════════
   SVG UTILS
═══════════════════════════════════════════════════ */
function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  if(attrs) for(const[k,v]of Object.entries(attrs)) e.setAttribute(k,v);
  if(parent) parent.appendChild(e);
  return e;
}
function txt(str,attrs,parent){
  const t=el('text',attrs,parent);
  t.textContent=str; return t;
}
function rr(x,y,w,h,r,attrs,parent){
  return el('rect',{x,y,width:w,height:h,rx:r,...(attrs||{})},parent);
}
function dotColor(c){ return c==='neutral'?T.neutralDot:c; }

/* ═══════════════════════════════════════════════════
   RENDER — reads from T for all SVG colors
═══════════════════════════════════════════════════ */
function render(){
  svg.innerHTML='';

  /* arrow markers */
  const defs=el('defs',{},svg);
  Object.entries(T.MC).forEach(([k,c])=>{
    const m=el('marker',{id:'m-'+k,viewBox:'0 0 10 10',refX:'8',refY:'5',
      markerWidth:'4.5',markerHeight:'4.5',orient:'auto-start-reverse'},defs);
    el('path',{d:'M2 1L8 5L2 9',fill:'none',stroke:c,'stroke-width':'1.5',
      'stroke-linecap':'round','stroke-linejoin':'round'},m);
  });

  /* background */
  rr(0,0,782,540,0,{fill:T.svgBg},svg);

  /* subtle grid */
  const grid=el('g',{stroke:T.grid,'stroke-width':'0.5'},svg);
  for(let gx=40;gx<782;gx+=40) el('line',{x1:gx,y1:0,x2:gx,y2:540},grid);
  for(let gy=40;gy<540;gy+=40) el('line',{x1:0,y1:gy,x2:782,y2:gy},grid);

  /* zones */
  T.ZONES.forEach(z=>{
    const g=el('g',{},svg);
    rr(z.x,z.y,z.w,z.h,8,{fill:z.fill,stroke:z.stroke,
      'stroke-width':z.hi?1:0.5,
      'stroke-dasharray':z.hi?'none':'4 3'},g);
    if(z.hi){
      rr(z.x+1,z.y+1,z.w-2,z.h-2,7,{fill:'none',
        stroke:T.zoneHiInner,'stroke-width':'0.5'},g);
    }
    txt(z.label.toUpperCase(),{
      x:z.x+8,y:z.y+14,fill:z.lc,
      'font-family':"'Prompt',sans-serif",'font-size':'7.5',
      'font-weight':'500','letter-spacing':'0.08em',opacity:'0.7'
    },g);
  });

  /* IATI sub-labels */
  [{y:120,label:'GOVERNANCE'},{y:205,label:'INFRASTRUCTURE'},{y:365,label:'COMPARABLE TOOLS'}].forEach(a=>{
    txt(a.label,{x:152,y:a.y,fill:T.iatiSublabel,
      'font-family':"'Prompt',sans-serif",'font-size':'6.5',
      'font-weight':'500','letter-spacing':'0.08em'},svg);
  });
  [193,358].forEach(yd=>{
    el('line',{x1:150,y1:yd,x2:350,y2:yd,stroke:T.iatiDivider,'stroke-width':'0.5'},svg);
  });

  /* context label */
  txt('GLOBAL AID CONTEXT',{x:55,y:14,fill:T.contextLabel,
    'font-family':"'Prompt',sans-serif",'font-size':'6.5',
    'font-weight':'500','letter-spacing':'0.1em'},svg);

  /* context chip connectors */
  [{cx:55,ty:65,tx:68},{cx:152,ty:65,tx:200},{cx:245,ty:65,tx:255},{cx:342,ty:65,tx:310}].forEach(c=>{
    el('line',{x1:c.cx,y1:47,x2:c.tx,y2:c.ty,
      stroke:T.connector,'stroke-width':'0.5','stroke-dasharray':'2 3'},svg);
  });

  /* edges */
  const edgeG=el('g',{id:'edges'},svg);
  EDGES.forEach(e=>{
    const s=T.ES[e.type];
    const p=e.pts;
    const d=`M${p.f[0]} ${p.f[1]} C${p.c1[0]} ${p.c1[1]},${p.c2[0]} ${p.c2[1]},${p.t[0]} ${p.t[1]}`;
    const da=s.anim?'6 5':(s.dash.length?s.dash.join(' '):'none');
    const pe=el('path',{
      d,fill:'none',stroke:s.stroke,'stroke-width':s.w,
      'stroke-linecap':'round','stroke-dasharray':da,
      'marker-end':'url(#m-'+e.type+')',
      'data-eid':e.id,'data-aida':s.aida?'1':'0',
    },edgeG);
    if(s.anim) pe.classList.add(s.anim);
  });

  /* nodes */
  NODES.forEach(n=>{
    const s=T.CS[n.cat];
    const x=n.cx-n.w/2, y=n.cy-n.h/2;
    const g=el('g',{'data-nid':n.id,style:'cursor:pointer'},svg);
    g.addEventListener('mouseenter',(ev)=>onHover(n,g,ev));
    g.addEventListener('mousemove',(ev)=>moveTooltip(ev));
    g.addEventListener('mouseleave',()=>onLeave(n,g));
    g.addEventListener('click',()=>onNodeClick(n));

    rr(x,y,n.w,n.h,6,{fill:s.fill,stroke:s.stroke,
      'stroke-width':n.isAida?1.2:'0.5',class:'nr'},g);

    if(n.isAida){
      rr(x,y,n.w,n.h,6,{fill:'none',stroke:T.aidaInnerBorder,'stroke-width':'0.5'},g);
      el('line',{x1:n.cx,y1:y+8,x2:n.cx,y2:y+n.h-8,stroke:T.aidaDivider,'stroke-width':'0.5'},g);
      txt('AIDA',{x:n.cx,y:n.cy-6,'text-anchor':'middle','dominant-baseline':'middle',
        fill:T.aidaTitle,'font-family':"'Prompt',sans-serif",'font-size':'14','font-weight':'700'},g);
      txt('Explorer',{x:n.cx-n.w/4,y:n.cy+10,'text-anchor':'middle','dominant-baseline':'middle',
        fill:T.aidaSub,'font-family':"'Inter',sans-serif",'font-size':'8'},g);
      txt('Publisher',{x:n.cx+n.w/4,y:n.cy+10,'text-anchor':'middle','dominant-baseline':'middle',
        fill:T.aidaSub,'font-family':"'Inter',sans-serif",'font-size':'8'},g);
    } else {
      const fs=n.cat==='ctx'?'8.5':'9.5';
      const ly=n.sub?n.cy-5:n.cy;
      txt(n.label,{x:n.cx,y:ly,'text-anchor':'middle','dominant-baseline':'middle',
        fill:s.lc,'font-family':"'Prompt',sans-serif",'font-size':fs,'font-weight':'500'},g);
      if(n.sub){
        txt(n.sub,{x:n.cx,y:n.cy+7,'text-anchor':'middle','dominant-baseline':'middle',
          fill:s.sc,'font-family':"'Inter',sans-serif",'font-size':n.cat==='ctx'?'7':'7.5'},g);
      }
    }

    /* invisible hit expand */
    rr(x-3,y-3,n.w+6,n.h+6,8,{fill:'transparent',stroke:'none'},g);
  });
}

/* ═══════════════════════════════════════════════════
   INTERACTIONS
═══════════════════════════════════════════════════ */
let selNode=null, focusOn=false, paused=false;
const tt=document.getElementById('tt');

function nodeById(id){ return NODES.find(n=>n.id===id); }

function connected(nid){
  const s=new Set([nid]);
  EDGES.forEach(e=>{ if(e.from===nid) s.add(e.to); if(e.to===nid) s.add(e.from); });
  return s;
}

function applyOpacity(nodeIds=null,aidaOnly=false){
  svg.querySelectorAll('[data-nid]').forEach(g=>{
    const nid=g.getAttribute('data-nid');
    let vis=true;
    if(nodeIds) vis=nodeIds.has(nid);
    if(aidaOnly){
      const node=nodeById(nid);
      vis=node&&(node.cat==='aida'||node.cat==='infra'||
        EDGES.some(e=>T.ES[e.type].aida&&(e.from===nid||e.to===nid)));
    }
    g.style.opacity=vis?'1':'0.12';
  });
  svg.querySelectorAll('[data-eid]').forEach(path=>{
    const eid=path.getAttribute('data-eid');
    const edge=EDGES.find(e=>e.id===eid);
    let vis=true;
    if(nodeIds) vis=edge&&(nodeIds.has(edge.from)||nodeIds.has(edge.to));
    if(aidaOnly) vis=edge&&T.ES[edge.type].aida;
    path.style.opacity=vis?'1':'0.05';
  });
}

function resetOpacity(){
  svg.querySelectorAll('[data-nid]').forEach(g=>g.style.opacity='1');
  svg.querySelectorAll('[data-eid]').forEach(p=>p.style.opacity='1');
}

function onHover(node,g,ev){
  g.querySelector('.nr').setAttribute('stroke-width',node.isAida?2:1.2);
  g.querySelector('.nr').style.filter='drop-shadow(0 0 6px rgba(59,108,211,.3))';
  const d=DD[node.id]||{desc:'',flows:[]};
  let html=`<div class="tt-name">${node.label}</div>`;
  if(node.sub) html+=`<div class="tt-sub">${node.sub}</div>`;
  if(d.desc) html+=`<div class="tt-desc">${d.desc}</div>`;
  if(d.flows&&d.flows.length){
    html+=`<div class="tt-flows">`;
    d.flows.forEach(f=>{
      html+=`<div class="tt-flow"><div class="tt-dot" style="background:${dotColor(f.c)}"></div>${f.l}</div>`;
    });
    html+=`</div>`;
  }
  tt.innerHTML=html;
  moveTooltip(ev);
  tt.classList.add('show');
  if(!focusOn&&!selNode) applyOpacity(connected(node.id));
}

function moveTooltip(ev){
  const mapRect=svg.parentElement.getBoundingClientRect();
  let tx=ev.clientX-mapRect.left+14;
  let ty=ev.clientY-mapRect.top-10;
  const ttW=tt.offsetWidth||220;
  const ttH=tt.offsetHeight||80;
  if(tx+ttW>mapRect.width-8) tx=ev.clientX-mapRect.left-ttW-14;
  if(ty+ttH>mapRect.height-8) ty=mapRect.height-ttH-8;
  if(ty<4) ty=4;
  tt.style.left=tx+'px';
  tt.style.top=ty+'px';
}

function onLeave(node,g){
  g.querySelector('.nr').setAttribute('stroke-width',node.isAida?1.2:0.5);
  g.querySelector('.nr').style.filter='none';
  tt.classList.remove('show');
  if(!focusOn&&!selNode) resetOpacity();
}

function onNodeClick(node){
  if(selNode&&selNode.id===node.id){
    selNode=null;
    if(focusOn) applyOpacity(null,true); else resetOpacity();
    return;
  }
  selNode=node;
  applyOpacity(connected(node.id));
}

svg.addEventListener('click',e=>{
  if(!e.target.closest('[data-nid]')){
    selNode=null;
    if(focusOn) applyOpacity(null,true); else resetOpacity();
  }
});

document.getElementById('btnF').addEventListener('click',function(){
  focusOn=!focusOn;
  this.classList.toggle('on',focusOn);
  this.textContent=focusOn?'Show all flows':'Highlight AIDA flows';
  selNode=null;
  if(focusOn) applyOpacity(null,true); else resetOpacity();
});

document.getElementById('btnP').addEventListener('click',function(){
  paused=!paused;
  this.classList.toggle('on',paused);
  this.textContent=paused?'Resume flow':'Pause flow';
  svg.querySelectorAll('.fa,.fa2,.fa3').forEach(e=>{
    e.style.animationPlayState=paused?'paused':'running';
  });
});

svg.addEventListener('mouseleave',()=>tt.classList.remove('show'));

/* ═══════════════════════════════════════════════════
   THEME SWITCHING
   Priority: URL param > postMessage > prefers-color-scheme
═══════════════════════════════════════════════════ */
function setTheme(name){
  T=name==='light'?LIGHT:DARK;
  document.documentElement.dataset.theme=name;
  render();
  /* restore any active focus state after re-render */
  if(selNode) applyOpacity(connected(selNode.id));
  else if(focusOn) applyOpacity(null,true);
}

function detectTheme(){
  const p=new URLSearchParams(location.search).get('theme');
  if(p==='light'||p==='dark') return p;
  return window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}

/* initial render */
setTheme(detectTheme());

/* OS preference changes (only when no URL override is present) */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
  if(!new URLSearchParams(location.search).has('theme')) setTheme(e.matches?'dark':'light');
});

/* postMessage from Framer parent:
   send window.postMessage({type:'theme', value:'light'}, '*') from a Framer code component */
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d) return;
  const v=d.value||d.colorScheme;
  if((d.type==='theme'||d.colorScheme)&&(v==='light'||v==='dark')) setTheme(v);
});
</script>

<script>
function postHeight(){
  const h=document.querySelector('.map-wrap').offsetHeight;
  window.parent.postMessage({type:'resize',height:h},'*');
}
window.addEventListener('load',postHeight);
new ResizeObserver(postHeight).observe(document.querySelector('.map-wrap'));
</script>
