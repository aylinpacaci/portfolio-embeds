<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: transparent;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Card fills the embed area ── */
  .chart-card {
    background: #fff;
    border: 0.5px solid #cfd4da;
    border-radius: 4px;
    width: 100%;
    height: 300px;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 16px 0;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
  }

  .chart-title {
    font-size: 12px;
    font-weight: 700;
    color: #252c34;
    white-space: nowrap;
  }

  .chart-legend {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .chart-legend span {
    font-size: 10px;
    color: #495057;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .chart-legend span::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .lg-1::before { background: #0a2840; }
  .lg-2::before { background: #013e77; }
  .lg-3::before { background: #00b5ae; }

  /* ── SVG container ── */
  .chart-wrap {
    flex: 1;
    padding: 8px 4px 4px;
    min-height: 0;
  }

  .chart-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Bar animations ── */
  .bar-rect {
    transform-origin: bottom;
    transform: scaleY(0);
    animation: growUp 0.5s cubic-bezier(0.2, 0, 0, 1) forwards;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .bg-1 .bar-rect { animation-delay: 0.2s; }
  .bg-2 .bar-rect { animation-delay: 0.4s; }
  .bg-3 .bar-rect { animation-delay: 0.6s; }

  @keyframes growUp { to { transform: scaleY(1); } }

  .bar-group {
    opacity: 0;
    animation: barIn 0.4s cubic-bezier(0.2, 0, 0, 1) forwards;
  }
  .bg-1 { animation-delay: 0.15s; }
  .bg-2 { animation-delay: 0.35s; }
  .bg-3 { animation-delay: 0.55s; }
  @keyframes barIn { to { opacity: 1; } }

  /* ── Hover: dim siblings ── */
  .bar-group.active .bar-rect { opacity: 0.35; }
  .bar-group.active .bar-rect.hovered { opacity: 1; }

  /* ── Tooltip ── */
  .tooltip {
    position: absolute;
    background: #252c34;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    line-height: 1.5;
    padding: 6px 10px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s, transform 0.15s;
    z-index: 10;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(37,44,52,0.12);
  }

  .tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .tooltip-label {
    font-weight: 700;
    margin-bottom: 1px;
  }

  .tooltip-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tooltip-swatch {
    width: 6px;
    height: 6px;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .tooltip-val {
    color: #cfd4da;
    margin-left: auto;
    padding-left: 10px;
  }
</style>
</head>
<body>

<div class="chart-card" id="chartCard">
  <div class="chart-header">
    <div class="chart-title">Dimension A · by reporting period</div>
    <div class="chart-legend">
      <span class="lg-1">Series 1</span>
      <span class="lg-2">Series 2</span>
      <span class="lg-3">Series 3</span>
    </div>
  </div>

  <div class="chart-wrap">
    <svg id="chartSvg" viewBox="0 0 500 230" preserveAspectRatio="xMidYMid meet">
      <!-- Grid -->
      <line x1="44" y1="180" x2="476" y2="180" stroke="#e9ecef" stroke-width="0.5"/>
      <line x1="44" y1="140" x2="476" y2="140" stroke="#f1f3f4" stroke-width="0.5"/>
      <line x1="44" y1="100" x2="476" y2="100" stroke="#f1f3f4" stroke-width="0.5"/>
      <line x1="44" y1="60"  x2="476" y2="60"  stroke="#f1f3f4" stroke-width="0.5"/>
      <line x1="44" y1="20"  x2="476" y2="20"  stroke="#f1f3f4" stroke-width="0.5"/>

      <!-- Y labels -->
      <text x="38" y="183" font-size="10" fill="#adb5bd" text-anchor="end" font-family="Inter">0</text>
      <text x="38" y="143" font-size="10" fill="#adb5bd" text-anchor="end" font-family="Inter">25</text>
      <text x="38" y="103" font-size="10" fill="#adb5bd" text-anchor="end" font-family="Inter">50</text>
      <text x="38" y="63"  font-size="10" fill="#adb5bd" text-anchor="end" font-family="Inter">75</text>
      <text x="38" y="23"  font-size="10" fill="#adb5bd" text-anchor="end" font-family="Inter">100</text>

      <!--
        Chart area height: 160px (y 20–180).
        3 clusters centered at x 126, 268, 410.
        Bar width 34, gap 4. Cluster = 34+4+34+4+34 = 110.
        Values scaled: val/100 * 160 = height, y = 180 - height.
      -->

      <!-- ── Period 1: 2016–2019 ── -->
      <g class="bar-group bg-1" data-period="2016–2019">
        <!-- S1: 89 → h=142, y=38 -->
        <rect class="bar-rect" x="71" y="38" width="34" height="142" rx="2" fill="#0a2840"
          data-series="Series 1" data-val="89"/>
        <!-- S2: 68 → h=109, y=71 -->
        <rect class="bar-rect" x="109" y="71" width="34" height="109" rx="2" fill="#013e77"
          data-series="Series 2" data-val="68"/>
        <!-- S3: 94 → h=150, y=30 -->
        <rect class="bar-rect" x="147" y="30" width="34" height="150" rx="2" fill="#00b5ae"
          data-series="Series 3" data-val="94"/>

        <text x="126" y="200" font-size="10" fill="#252c34" text-anchor="middle" font-family="Inter" font-weight="700">2016–2019</text>
        <text x="126" y="214" font-size="9" fill="#adb5bd" text-anchor="middle" font-family="Inter">Period 1</text>
      </g>

      <!-- ── Period 2: 2020–2022 ── -->
      <g class="bar-group bg-2" data-period="2020–2022">
        <!-- S1: 65 → h=104, y=76 -->
        <rect class="bar-rect" x="213" y="76" width="34" height="104" rx="2" fill="#0a2840"
          data-series="Series 1" data-val="65"/>
        <!-- S2: 47 → h=75, y=105 -->
        <rect class="bar-rect" x="251" y="105" width="34" height="75" rx="2" fill="#013e77"
          data-series="Series 2" data-val="47"/>
        <!-- S3: 75 → h=120, y=60 -->
        <rect class="bar-rect" x="289" y="60" width="34" height="120" rx="2" fill="#00b5ae"
          data-series="Series 3" data-val="75"/>

        <text x="268" y="200" font-size="10" fill="#252c34" text-anchor="middle" font-family="Inter" font-weight="700">2020–2022</text>
        <text x="268" y="214" font-size="9" fill="#adb5bd" text-anchor="middle" font-family="Inter">Period 2</text>
      </g>

      <!-- ── Period 3: 2023–2024 ── -->
      <g class="bar-group bg-3" data-period="2023–2024">
        <!-- S1: 81 → h=130, y=50 -->
        <rect class="bar-rect" x="355" y="50" width="34" height="130" rx="2" fill="#0a2840"
          data-series="Series 1" data-val="81"/>
        <!-- S2: 63 → h=101, y=79 -->
        <rect class="bar-rect" x="393" y="79" width="34" height="101" rx="2" fill="#013e77"
          data-series="Series 2" data-val="63"/>
        <!-- S3: 88 → h=141, y=39 -->
        <rect class="bar-rect" x="431" y="39" width="34" height="141" rx="2" fill="#00b5ae"
          data-series="Series 3" data-val="88"/>

        <text x="410" y="200" font-size="10" fill="#252c34" text-anchor="middle" font-family="Inter" font-weight="700">2023–2024</text>
        <text x="410" y="214" font-size="9" fill="#adb5bd" text-anchor="middle" font-family="Inter">Period 3</text>
      </g>
    </svg>
  </div>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip">
    <div class="tooltip-label" id="ttLabel"></div>
    <div class="tooltip-row">
      <div class="tooltip-swatch" id="ttSwatch"></div>
      <span id="ttSeries"></span>
      <span class="tooltip-val" id="ttVal"></span>
    </div>
  </div>
</div>

<script>
(function() {
  const card = document.getElementById('chartCard');
  const svg = document.getElementById('chartSvg');
  const tooltip = document.getElementById('tooltip');
  const bars = svg.querySelectorAll('.bar-rect');

  const colorMap = {
    'Series 1': '#0a2840',
    'Series 2': '#013e77',
    'Series 3': '#00b5ae'
  };

  function svgToCard(svgX, svgY) {
    const pt = svg.createSVGPoint();
    pt.x = svgX; pt.y = svgY;
    const screenPt = pt.matrixTransform(svg.getScreenCTM());
    const r = card.getBoundingClientRect();
    return { x: screenPt.x - r.left, y: screenPt.y - r.top };
  }

  function activate(bar) {
    const group = bar.closest('.bar-group');
    const period = group.dataset.period;
    const series = bar.dataset.series;
    const val = bar.dataset.val;

    // Dim siblings
    group.classList.add('active');
    bar.classList.add('hovered');

    // Tooltip content
    document.getElementById('ttLabel').textContent = period;
    document.getElementById('ttSeries').textContent = series;
    document.getElementById('ttVal').textContent = val;
    document.getElementById('ttSwatch').style.background = colorMap[series] || '#cfd4da';

    // Position
    const bx = parseFloat(bar.getAttribute('x'));
    const by = parseFloat(bar.getAttribute('y'));
    const bw = parseFloat(bar.getAttribute('width'));
    const pos = svgToCard(bx + bw + 6, by);
    const ttW = tooltip.offsetWidth;
    const cardW = card.offsetWidth;

    if (pos.x + ttW + 8 > cardW) {
      const posLeft = svgToCard(bx - 6, by);
      tooltip.style.left = (posLeft.x - ttW) + 'px';
    } else {
      tooltip.style.left = pos.x + 'px';
    }
    tooltip.style.top = pos.y + 'px';
    tooltip.classList.add('visible');
  }

  function deactivate(bar) {
    const group = bar.closest('.bar-group');
    group.classList.remove('active');
    bar.classList.remove('hovered');
    tooltip.classList.remove('visible');
  }

  function deactivateAll() {
    bars.forEach(b => {
      b.classList.remove('hovered');
      b.closest('.bar-group').classList.remove('active');
    });
    tooltip.classList.remove('visible');
  }

  bars.forEach(bar => {
    bar.addEventListener('mouseenter', () => activate(bar));
    bar.addEventListener('mouseleave', () => deactivate(bar));
    bar.addEventListener('touchstart', (e) => {
      e.preventDefault();
      deactivateAll();
      activate(bar);
    }, { passive: false });
  });

  card.addEventListener('mouseleave', deactivateAll);

  document.addEventListener('touchstart', (e) => {
    if (!card.contains(e.target)) deactivateAll();
  });
})();
</script>
</body>
</html>
