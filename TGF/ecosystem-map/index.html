<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #fff;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .eco-wrap {
    width: 100%;
    height: 100%;
    min-height: 580px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .eco-svg {
    width: 100%;
    flex: 1;
    display: block;
    min-height: 0;
  }

  .node { cursor: pointer; }
  .node:hover .node-circle {
    filter: drop-shadow(0 3px 10px rgba(10,40,64,0.3));
  }

  .pulse-ring {
    animation: pulse 2.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0; }
  }

  .fade-up {
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.2, 0, 0, 1) forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eco-tooltip {
    position: absolute;
    background: #252c34;
    color: #fff;
    font-family: 'Inter', sans-serif;
    padding: 12px 16px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s;
    z-index: 20;
    max-width: 240px;
    box-shadow: 0 6px 20px rgba(37,44,52,0.2);
  }
  .eco-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .eco-tooltip-cat {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #00b5ae;
    margin-bottom: 4px;
  }
  .eco-tooltip-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .eco-tooltip-body {
    font-size: 12px;
    color: #cfd4da;
    line-height: 1.55;
  }

  /* Legend sits right below the SVG */
  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
    padding: 6px 0 10px;
    flex-shrink: 0;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: #495057;
    white-space: nowrap;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="eco-wrap" id="ecoWrap">
  <svg class="eco-svg" id="ecoSvg" viewBox="0 0 960 660" preserveAspectRatio="xMidYMid meet">

    <!-- ═══ RING FILLS ═══ -->
    <path d="M 480,640 m -340,0 a 340,340 0 0,1 680,0" fill="#f4f7fa" class="fade-up" style="animation-delay:0.05s"/>
    <path d="M 480,640 m -245,0 a 245,245 0 0,1 490,0" fill="#eaf1f8" class="fade-up" style="animation-delay:0.1s"/>
    <path d="M 480,640 m -150,0 a 150,150 0 0,1 300,0" fill="#dde9f3" class="fade-up" style="animation-delay:0.15s"/>

    <line x1="310" y1="510" x2="215" y2="440" stroke="#b8d0e4" stroke-width="1" stroke-dasharray="6 4" class="fade-up" style="animation-delay:0.64s"/>
    <line x1="650" y1="510" x2="745" y2="440" stroke="#b8d0e4" stroke-width="1" stroke-dasharray="6 4" class="fade-up" style="animation-delay:0.66s"/>

    <line x1="300" y1="395" x2="275" y2="325" stroke="#cfdde9" stroke-width="1" stroke-dasharray="4 4" class="fade-up" style="animation-delay:0.72s"/>
    <line x1="660" y1="395" x2="685" y2="325" stroke="#cfdde9" stroke-width="1" stroke-dasharray="4 4" class="fade-up" style="animation-delay:0.74s"/>
    <line x1="765" y1="418" x2="810" y2="350" stroke="#cfdde9" stroke-width="1" stroke-dasharray="4 4" class="fade-up" style="animation-delay:0.76s"/>

    <!-- ═══ EDGE LABELS ═══ -->
    <g class="fade-up" style="animation-delay:1s">
      <rect x="490" y="540" width="92" height="20" rx="4" fill="#fff" fill-opacity="0.9"/>

      <text x="382" y="574" font-size="12" fill="#495057" font-family="Inter" font-style="italic" text-anchor="middle">feeds data</text>

      <text x="615" y="520" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" font-family="Inter">Data</text>
      <text x="615" y="536" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" font-family="Inter">Downloads</text>

       data-cat="Governance"
       data-desc="The primary hub for global health advocacy, policies, news, replenishment campaigns, and the annual Results Report.">
      <circle class="node-circle" cx="215" cy="435" r="34" fill="#013e77"/>
      <text x="215" y="430" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" font-family="Inter">Corporate</text>
      <text x="215" y="446" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" font-family="Inter">Website</text>
    </g>

    <g class="node fade-up" style="animation-delay:0.65s"
       data-title="Results Report"

      <text x="640" y="400" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" font-family="Inter">Digital</text>

  <!-- Legend — directly under the SVG, no absolute positioning -->

    <div class="legend-item"><div class="legend-dot" style="background:#0a2840"></div>Direct dependency</div>

    <div class="eco-tooltip-title" id="ttTitle"></div>
    <div class="eco-tooltip-body" id="ttBody"></div>
  </div>
</div>

<script>
(function() {
  const wrap = document.getElementById('ecoWrap');
  const svg = document.getElementById('ecoSvg');
  const tooltip = document.getElementById('tooltip');
  const nodes = svg.querySelectorAll('.node');

  function svgToPage(sx, sy) {
    const pt = svg.createSVGPoint();
    pt.x = sx; pt.y = sy;
    const sp = pt.matrixTransform(svg.getScreenCTM());
    const r = wrap.getBoundingClientRect();
    return { x: sp.x - r.left, y: sp.y - r.top };
  }

  function show(node) {
    document.getElementById('ttTitle').textContent = node.dataset.title;
    document.getElementById('ttCat').textContent = node.dataset.cat;
    document.getElementById('ttBody').textContent = node.dataset.desc;

    const circle = node.querySelector('circle.node-circle');
    let cx, cy, nr;
    if (circle) {
      cx = parseFloat(circle.getAttribute('cx'));
      cy = parseFloat(circle.getAttribute('cy'));
      nr = parseFloat(circle.getAttribute('r'));
    } else {
      cx = parseFloat(node.dataset.cx || 480);
      cy = parseFloat(node.dataset.cy || 640);
      nr = parseFloat(node.dataset.r || 55);
      cy = cy - nr;
    }

    const pos = svgToPage(cx, cy - nr - 10);
    const ttW = tooltip.offsetWidth;
    const wrapW = wrap.offsetWidth;

    let left = pos.x - ttW / 2;
    if (left < 8) left = 8;
    if (left + ttW > wrapW - 8) left = wrapW - ttW - 8;

    let top = pos.y - tooltip.offsetHeight - 6;
    if (top < 4) {
      const pb = svgToPage(cx, cy + nr + 10);
      top = pb.y + 6;
    }

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.classList.add('visible');
  }

  function hide() { tooltip.classList.remove('visible'); }

  nodes.forEach(n => {
    n.addEventListener('mouseenter', () => show(n));
    n.addEventListener('mouseleave', hide);
    n.addEventListener('touchstart', (e) => { e.preventDefault(); hide(); setTimeout(() => show(n), 10); }, { passive: false });
  });

  wrap.addEventListener('mouseleave', hide);
  document.addEventListener('touchstart', (e) => { if (!wrap.contains(e.target)) hide(); });
})();
</script>
</body>
</html>
